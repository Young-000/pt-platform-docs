title: recoverGX Docs
description: 오픈형 GX 그룹 클래스 플랫폼 (슈퍼몽키형) — 제품 문서, 정책, 의사결정 기록

remote_theme: just-the-docs/just-the-docs

# 검색 활성화
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10

# 사이드바 보조 링크
aux_links:
  "📊 시뮬레이션":
    - "/pt-platform-docs/economics/simulation.html"
  "GitHub Repo":
    - "https://github.com/Young-000/pt-platform-docs"
  "유저 앱":
    - "https://pt-platform-mvp.vercel.app"
  "강사 앱":
    - "https://pt-platform-partner.vercel.app"
  "어드민":
    - "https://pt-platform-admin.vercel.app"

# Mermaid 다이어그램
mermaid:
  version: "10.9.0"

# Callouts (note/warning/tip)
callouts:
  warning:
    title: 주의
    color: red
  note:
    title: 메모
    color: blue
  tip:
    title: 팁
    color: green

# 마지막 수정일 표시
last_edit_timestamp: true
last_edit_time_format: "%Y-%m-%d %H:%M"

# 페이지 하단 "GitHub에서 편집" 링크
gh_edit_link: true
gh_edit_link_text: "이 페이지 GitHub에서 편집하기"
gh_edit_repository: "https://github.com/Young-000/pt-platform-docs"
gh_edit_branch: "main"
gh_edit_source: /
gh_edit_view_mode: "edit"

# 페이지 하단 "이슈 등록" 링크 (수정 요청용)
nav_external_links:
  - title: "수정 요청 / 이슈 등록"
    url: "https://github.com/Young-000/pt-platform-docs/issues/new/choose"
    hide_icon: false

# 푸터
footer_content: "PT Platform — 내부 문서. 외부 공유 금지."

# 색상 모드
color_scheme: light

# 코드 복사 버튼
enable_copy_code_button: true

# 시간대
timezone: Asia/Seoul

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
